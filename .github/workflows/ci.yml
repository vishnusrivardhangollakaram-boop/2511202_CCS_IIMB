name: Verify Evidence AI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ccs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Disposable CI service only; never use deployment credentials here.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ccs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-streamlit.lock.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pip install ruff==0.17.4
      - run: ruff check evidence_streamlit tests_streamlit streamlit_app.py
      - run: ruff format --check evidence_streamlit tests_streamlit streamlit_app.py
      - run: python -m compileall -q evidence_streamlit streamlit_app.py
      - run: python -m unittest discover -s tests_streamlit -p 'test_*.py' -v
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: pnpm evaluate
      - run: pnpm build
      - run: pnpm audit --audit-level=high
