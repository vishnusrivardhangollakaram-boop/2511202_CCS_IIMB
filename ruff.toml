target-version = "py312"
line-length = 100
include = ["evidence_streamlit/**/*.py", "tests_streamlit/**/*.py", "streamlit_app.py"]

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# Streamlit page configuration is set before importing the application modules.
"streamlit_app.py" = ["E402"]
