# Example only. Copy to ignored .streamlit/secrets.toml locally, or paste your
# real values into Community Cloud -> App settings -> Secrets. Never commit keys.
# No secrets are required to run isolated synthetic/manual session examples.

# REQUIRE_LOGIN = true
# ALLOWED_USER_IDS = ["oidc:your-stable-account-id"]
# REVIEWER_IDS = ["oidc:your-authorised-reviewer-id"]

# MODEL_PROVIDER = "groq"
# GROQ_API_KEY = "your-server-side-key"
# GROQ_MODEL = "qwen/qwen3.8-27b"
# TAVILY_API_KEY = "your-server-side-key"
# Alternative explicit model service; never used as an automatic fallback:
# MODEL_PROVIDER = "gemini"
# GEMINI_API_KEY = "your-server-side-key"
# GEMINI_MODEL = "your-compatible-enabled-model-id"

# Optional durable storage: external PostgreSQL only, with provider-required TLS.
# Initialize once using python -m evidence_streamlit.storage init before use.
# DATABASE_URL = "postgresql+psycopg://user:password@host/database?sslmode=require"

# Optional OpenID Connect. Register this exact redirect URL with your provider.
# Streamlit Community Cloud sign-in is separate from application OIDC identity.
# Sign in once, copy Your account ID, then add it to ALLOWED_USER_IDS/REVIEWER_IDS.
# Use a cryptographically random cookie_secret generated locally, e.g.
# python -c "import secrets; print(secrets.token_urlsafe(48))"
# [auth]
# redirect_uri = "https://your-app-subdomain.streamlit.app/oauth2callback"
# cookie_secret = "your-long-random-cookie-secret"
# client_id = "your-oidc-client-id"
# client_secret = "your-oidc-client-secret"
# server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
